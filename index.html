<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TP Tech WAN - Simulations</title>
<style>
  :root{
    --bg:#fff1f7; --bg2:#ffd9ea; --card:#ffffff; --title:#b0246f; --text:#8f6a80;
    --pill-bg:#ffe4f1; --pill-text:#d6336c; --accent:#ff5fa2; --accent2:#b388ff;
    --border:#f9d3e5; --shadow:rgba(214,51,108,.09); --shadow-h:rgba(255,95,162,.30);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#25102e; --bg2:#3e1748; --card:#341a40; --title:#ffb8dc; --text:#d2aac2;
      --pill-bg:#4e2459; --pill-text:#ff9ccc; --accent:#ff7ab8; --accent2:#c9a6ff;
      --border:#5b2e6b; --shadow:rgba(0,0,0,.28); --shadow-h:rgba(255,122,184,.30);}
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:linear-gradient(180deg,var(--bg2) 0,var(--bg) 340px) var(--bg);
  }
  header{max-width:1520px;margin:0 auto;padding:56px 24px 8px;text-align:center}
  header h1{
    margin:0;font-size:clamp(2rem,4vw,2.8rem);font-weight:800;letter-spacing:-.5px;
    background:linear-gradient(90deg,var(--title),var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header p{margin:10px auto 24px;max-width:640px;font-size:1.05rem;line-height:1.6}
  #search{
    width:100%;max-width:460px;padding:14px 22px;font-size:1rem;
    border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--title);
    box-shadow:0 4px 14px var(--shadow);transition:box-shadow .2s,border-color .2s;
  }
  #search::placeholder{color:var(--text)}
  #search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--shadow-h)}
  #msg{max-width:1520px;margin:24px auto 0;padding:0 24px;text-align:center}
  .grid{
    max-width:1520px;margin:0 auto;padding:36px 24px 72px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px;
  }
  .card{
    position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;gap:36px;
    min-height:300px;padding:28px;border-radius:24px;
    background:var(--card);border:1px solid var(--border);
    text-decoration:none;color:inherit;
    box-shadow:0 6px 20px var(--shadow);
    transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
  }
  .card::before{
    content:"";position:absolute;inset:0 0 auto 0;height:5px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transform:scaleX(0);transform-origin:left;transition:transform .3s ease;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-8px);border-color:var(--accent);outline:none;
    box-shadow:0 18px 36px var(--shadow-h);
  }
  .card:hover::before,.card:focus-visible::before{transform:scaleX(1)}
  .top{display:flex;flex-direction:column;gap:26px}
  .tag{
    align-self:flex-start;display:inline-flex;align-items:center;gap:8px;
    padding:8px 16px;border-radius:999px;
    background:var(--pill-bg);color:var(--pill-text);font-weight:700;font-size:.9rem;
  }
  .tag::before{content:"\2665";font-size:.85rem;color:var(--accent)}
  .card h2{margin:0;font-size:1.65rem;line-height:1.2;font-weight:800;color:var(--title);overflow-wrap:anywhere}
  .card .desc{
    margin:0;padding-top:16px;border-top:1px solid var(--border);
    font-size:1rem;line-height:1.6;
  }
  .card .desc::after{
    content:"Ouvrir la simulation \2192";display:block;margin-top:10px;
    font-weight:700;color:var(--accent);opacity:0;transform:translateX(-6px);
    transition:opacity .25s,transform .25s;
  }
  .card:hover .desc::after,.card:focus-visible .desc::after{opacity:1;transform:none}
  @media (hover:none){.card .desc::after{opacity:1;transform:none}}
  @media (max-width:520px){.grid{grid-template-columns:1fr;gap:20px}.card{min-height:240px}}
  @media (prefers-reduced-motion:reduce){
    .card,.card::before,.card .desc::after,#search{transition:none}
    .card:hover{transform:none}
  }
</style>
</head>
<body>
<header>
  <h1>Mes Simulations</h1>
  <p>Travaux pratiques - Technologies WAN. Explorez les simulations interactives et testez vos connaissances.</p>
  <input id="search" type="search" placeholder="Rechercher un TP…" aria-label="Rechercher un TP">
</header>
<p id="msg"></p>
<main class="grid" id="grid"></main>

<script>
/* ============================================================
   AJOUTER UN TP = déposer son dossier dans /simulations/ sur GitHub.
   La page détecte les dossiers toute seule (API GitHub).
   Pour personnaliser une carte (pastille / titre), ajoutez-la dans
   TITRES ci-dessous. Sinon, le nom du dossier sert de titre.
   ============================================================ */
const TITRES = {
  // Clé = nom EXACT du dossier dans "simulation" (majuscules et espaces compris)
  "tp1 mpls p1et p2":         { tag: "TP 01", titre: "TP1 - MPLS (P1 et P2)" },
  "TP2_VPN_MPLS_Simulation":  { tag: "TP 02", titre: "TP2 - VPN MPLS" },
  "tp6-basic":                { tag: "TP 06", titre: "TP6 - Basic" },
  "tp6 advanced":             { tag: "TP 06", titre: "TP6 - Advanced" },
  "lab bgp":                  { tag: "TP BGP", titre: "BGP" },
  "Lab Redistribution":       { tag: "TP Redistribution", titre: "Redistribution" },
  "tp dhcp":                  { tag: "TP DHCP", titre: "DHCP" },
  "TP VPN IPSec":             { tag: "TP VPN", titre: "VPN IPSec" }
};

const DOSSIER = "simulation";   // dossier principal dans votre dépôt
const SOUS_DOSSIER = "HTML5";   // sous-dossier créé par l'export ActivePresenter
const T = {};
Object.keys(TITRES).forEach(k => T[k.toLowerCase()] = TITRES[k]);
const grid = document.getElementById("grid");
const msg = document.getElementById("msg");
const search = document.getElementById("search");
let cartes = [];

function infos(nom){
  const k = nom.toLowerCase();
  if (T[k]) return T[k];
  if (/gre/i.test(nom)) return { tag: "TP GRE", titre: "GRE over IPsec" };
  const m = nom.match(/^TP[-_ ]?(\d+)/i);
  return {
    tag: m ? "TP " + m[1].padStart(2, "0") : nom.split(/[-_ ]/)[0],
    titre: nom.replace(/[-_]/g, " ")
  };
}

function afficher(noms){
  noms.sort((a, b) => a.localeCompare(b, "fr", { numeric: true }));
  cartes = noms.map(nom => {
    const { tag, titre } = infos(nom);
    const a = document.createElement("a");
    a.className = "card";
    a.href = DOSSIER + "/" + encodeURIComponent(nom) + "/" + SOUS_DOSSIER + "/";
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML = '<div class="top"><span class="tag"></span><h2></h2></div>' +
      '<p class="desc">Présentation interactive<br>ActivePresenter</p>';
    a.querySelector(".tag").textContent = tag;
    a.querySelector("h2").textContent = titre;
    a.dataset.q = (tag + " " + titre + " " + nom).toLowerCase();
    grid.appendChild(a);
    return a;
  });
}

async function charger(){
  const h = location.hostname;
  const seg = location.pathname.split("/")[1] || "";
  const repo = (seg && !seg.endsWith(".html")) ? seg : h; // dépôt "NOM.github.io" : pas de sous-chemin
  let noms = [];
  try {
    if (!h.endsWith(".github.io")) throw 0;
    const r = await fetch("https://api.github.com/repos/" + h.split(".")[0] + "/" + repo + "/contents/" + DOSSIER);
    if (!r.ok) throw 0;
    noms = (await r.json()).filter(f => f.type === "dir").map(f => f.name);
  } catch (e) {
    noms = Object.keys(TITRES); // secours : liste connue
  }
  afficher(noms);
}

search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  let n = 0;
  cartes.forEach(c => { const ok = c.dataset.q.includes(q); c.hidden = !ok; if (ok) n++; });
  msg.textContent = n ? "" : "Aucun TP ne correspond à cette recherche.";
});

charger();
</script>
</body>
</html>
